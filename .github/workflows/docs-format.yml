name: Docs Format

# This is a Python project with no linter, formatter or type checker by
# design — the `check` job in ci.yml (compileall + a headless Qt smoke test)
# is the whole gate, and adding ruff/black/mypy would be a real toolchain
# decision.
#
# Markdown is a separate question. `docs/`, `agent_docs/`, the ADRs and the
# skill files had no check of any kind, so documentation drifted freely. This
# workflow gates Markdown only.
#
# Prettier runs via `npx` at a pinned version. There is deliberately no
# package.json: adding a Node manifest to a Python repository just to hold a
# formatter would be a bigger change than the problem warrants. The same
# command is documented in CONTRIBUTING.md so it can be run locally.

on:
  pull_request:
    paths:
      - "**.md"
  push:
    branches: [main]
    paths:
      - "**.md"

concurrency:
  group: docs-format-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege: this job only checks out the repository and runs Prettier.
permissions:
  contents: read

jobs:
  format:
    name: Prettier (Markdown)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Actions are pinned by commit SHA, never by tag (#22).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Only Prettier runs after this — no git, so the token has no reason
          # to stay in .git/config for the rest of the job.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # Version pinned here and mirrored in CONTRIBUTING.md — keep the two in
      # sync when bumping.
      - name: Check Markdown formatting
        run: npx --yes prettier@3.9.6 --check "**/*.md"
