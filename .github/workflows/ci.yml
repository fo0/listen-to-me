name: CI

# Fast checks only — no build, no release, no artifacts.
# Runs on every pull request, and is reused by release.yml via workflow_call.

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# One in-flight run per pull request: a second push supersedes the first, and
# the run it obsoleted has nothing left to report. The fallback is the run id,
# not the ref, on purpose — a run reached through workflow_call (release.yml)
# then lands in a group of its own, so a release build can never be cancelled
# by, or queued behind, another one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: Syntax check & UI smoke test
    runs-on: ubuntu-latest
    # The job compiles, installs two wheels and runs one headless Qt pass —
    # minutes, not hours. Without a cap a hung apt/pip mirror or a Qt process
    # that never exits holds a runner for GitHub's 6-hour default and the pull
    # request shows "in progress" all that time instead of failing.
    timeout-minutes: 20
    steps:
      # Third-party actions are pinned by commit SHA, not by tag: a tag can be
      # moved to point at different code. Update deliberately, keeping the
      # trailing comment in sync with the SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Compile all sources
        run: python -m compileall -q src scripts
      - name: Install UI smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libfreetype6
          python -m pip install --upgrade pip
          pip install "PySide6>=6.6" Pillow
      - name: Qt UI smoke test (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: PYTHONPATH=src python -c "import sys; from listen_to_me.selftest import gui_smoke; sys.exit(gui_smoke())"
